<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Drive</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">The G-Class</a></li>
                <li><a href="contact.html" class="active">Test Drive</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Book a Test Drive</h1>
        
        <form action="#" method="get">
            <fieldset>
                <legend>Client Information</legend>
                
                <div>
                    <label for="client-name">Full Name:</label>
                    <input type="text" id="client-name" name="client-name" required placeholder="Enter your name" maxlength="60">
                </div>

                <div>
                    <label for="client-email">Email Address:</label>
                    <input type="email" id="client-email" name="client-email" required placeholder="client@example.com">
                </div>

                <div>
                    <label for="booking-date">Preferred Date:</label>
                    <input type="date" id="booking-date" name="booking-date" min="2026-09-01" max="2027-12-31">
                </div>

                <div>
                    <p>Select Vehicle Type:</p>
                    <input type="radio" id="type-sedan" name="car-type" value="sedan">
                    <label for="type-sedan">Luxury Sedan</label>
                    
                    <input type="radio" id="type-suv" name="car-type" value="suv">
                    <label for="type-suv">SUV / Off-Road</label>
                </div>

                <div>
                    <input type="checkbox" id="promo" name="promo" value="agree">
                    <label for="promo">I want to receive special offers from the dealership.</label>
                </div>

                <div>
                    <label for="requests">Special Requests:</label><br>
                    <textarea id="requests" name="requests" rows="4" cols="40" placeholder="e.g., specific engine or color..."></textarea>
                </div>

                <button type="submit">Submit Request</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mercedes-Benz Unofficial Fan Page</p>
    </footer>
</body>
</html>
